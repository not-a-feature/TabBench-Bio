name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Build and install package (core + dev)
        run: |
          pip install build
          python -m build
          wheels=(dist/*.whl)
          pip install "${wheels[0]}[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/ benchmark_my_model/

      - name: Format check
        run: ruff format --check src/ tests/ benchmark_my_model/

      - name: Run tests
        run: pytest tests/ -v --tb=short -o pythonpath=.
        env:
          MPLBACKEND: Agg

      - name: Smoke test installed SQLite API and CLI plot
        run: python scripts/smoke_sqlite_api.py
        env:
          MPLBACKEND: Agg
