[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabbench-bio"
version = "0.1.0"
description = "A benchmark for machine learning on high-dimensional biological data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jules Kreuer", email = "jules.kreuer@uni-tuebingen.de" },
]
maintainers = [
    { name = "Jules Kreuer", email = "jules.kreuer@uni-tuebingen.de" },
]
keywords = [
    "benchmark", "machine-learning", "tabular", "autogluon",
    "bioinformatics", "genomics", "gene-expression", "hdlss", "biology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.21,<2.0",
    "pandas>=1.4,<3.0",
    "scikit-learn>=1.1,<2.0",
    "matplotlib>=3.5,<4.0",
    "tqdm>=4.64,<5.0",
]

[project.optional-dependencies]
# Model fitting via AutoGluon. The fork (requirements-autogluon-fork.txt) lifts the
# 500-feature cap on tabular foundation models — required for HDLSS omics matrices.
autogluon = [
    "torch>=2.0,<3.0",
    "autogluon.common>=1.5",
    "autogluon.core>=1.5",
    "autogluon.features>=1.5",
    "autogluon.tabular>=1.5",
]
# Extra tabular foundation / interpretable model backends.
models = [
    "imodels>=2.0.4",
    "tabpfn>=8.0.3",
    "pytabkit>=1.7.3",
    "tabdpt>=1.1.12",
    # TabPFN-Wide: wide-dataset TabPFN variant (key "TABPFN-WIDE"). v0.3 pins tabpfn==8.0.3.
    "tabpfnwide>=0.3.0",
    # TabFM: Google Research zero-shot tabular foundation model (key "TABFM"). Not on PyPI;
    # installed from source with the PyTorch backend (the JAX backend is not used).
    "tabfm[pytorch] @ git+https://github.com/google-research/tabfm",
    # ManyClassClassifier (ECOC) — lets TabPFN / TabFM models handle >10-class datasets.
    "tabpfn-extensions>=0.4.0",
    # AutoGluon model backends NOT pulled in by the core autogluon.* install. Without
    # these the MITRA / TABICL models fail outright ("No module named 'loguru'/'tabicl'")
    # and CatBoost is silently skipped inside the AUTOGLUON portfolio.
    #   - CatBoost   -> key "CAT" (GBM used by the AUTOGLUON zeroshot portfolio)
    #   - TabICL     -> key "TABICL"
    #   - MITRA deps -> key "MITRA" (loguru/einx/transformers; omegaconf/einops come via AG)
    # Installed as leaf packages on purpose: the autogluon.tabular[mitra] extra pins
    # torch<2.10 and huggingface_hub<1.0, which would downgrade the torch 2.12 / hf_hub
    # 1.19 stack that TabPFN 8.0.3 requires. These leaves work fine with the newer stack.
    "catboost>=1.2,<1.3",
    "tabicl>=2.0,<2.1",
    "xgboost>=2.0,<3.2",
    "loguru",
    "einx",
    "transformers",
]
# Dataset loaders (GEO/TCGA/Kaggle/OpenML). Only needed to (re)fetch the biological
# datasets from their original sources; the per-source libs are imported lazily so the
# core package never requires them.
bio = [
    "GEOparse>=2.0",
    "biopython>=1.81",
    "requests>=2.31",
    "kagglehub>=0.3",
    "openml>=0.14.1",
    "pyarrow>=12.0",
    # Reproducible curation of the compact PEER protein-embedding task.
    "lmdb>=1.4,<3.0",
    # Molecular endpoints: ECFP4 fingerprints and Bemis-Murcko scaffold groups.
    # Data are fetched directly from the official TDC Harvard Dataverse files;
    # PyTDC is intentionally not required because its dependency stack is fragile.
    "rdkit>=2024.3",
]
full = [
    "tabbench-bio[autogluon]",
    "tabbench-bio[models]",
    "tabbench-bio[bio]",
    "pynvml>=11.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=1.25",
]

[project.urls]
Homepage      = "https://github.com/not-a-feature/TabBench-Bio"
Repository    = "https://github.com/not-a-feature/TabBench-Bio"
"Bug Tracker" = "https://github.com/not-a-feature/TabBench-Bio/issues"

[project.scripts]
tabbench-bio = "tabbench_bio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
tabbench_bio = ["bio/data/*.json"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["tabbench_bio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "E501",   # line too long — handled by black
    "N803",   # argument name should be lowercase — X, y are standard ML conventions
    "N806",   # variable in function should be lowercase — X_train, X_test etc.
    "N812",   # lowercase imported as non-lowercase — torch.nn.functional as F is universal
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
